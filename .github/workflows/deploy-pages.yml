name: Deploy Fitness App to GitHub Pages

on:
  push:
    branches: [claude/ios-fitness-app-timer-70zlxr]
    paths: [ios-fitness-app/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ios-fitness-app
      - id: deployment
        uses: actions/deploy-pages@v4
